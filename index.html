<style>
:root{--bg:#F7F4FB;--card:#fff;--ink:#2A1F3D;--mut:#6B5F80;--pri:#5B2D8E;--pri2:#3E1D66;--sos:#C62828;--amb:#C9A227;--line:#DDD3EA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150F20;--card:#211733;--ink:#EEE8F7;--mut:#B3A6C9;--pri:#A67BE0;--pri2:#3E1D66;--line:#3A2B55}}
:root[data-theme="dark"]{--bg:#150F20;--card:#211733;--ink:#EEE8F7;--mut:#B3A6C9;--pri:#A67BE0;--pri2:#3E1D66;--line:#3A2B55}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Mukta',system-ui,sans-serif;font-size:17px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:linear-gradient(135deg,#3E1D66 0%,#5B2D8E 100%);color:#fff;border-bottom:3px solid #C9A227;box-shadow:0 2px 8px rgba(62,29,102,.25)}
header h1{margin:0;font-size:23px;font-weight:700;letter-spacing:.4px}
h1,h2{font-family:'Playfair Display','Mukta',Georgia,serif}
h2{position:relative;padding-bottom:6px}
h2:after{content:'';display:block;width:42px;height:2px;background:var(--amb);margin-top:5px}
header small{display:block;font-weight:400;opacity:.9;font-size:13px}
#lang{max-width:150px;background:#fff;color:#3E1D66;border:0;border-radius:20px;padding:6px 14px;font:600 15px 'Mukta',sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px;box-shadow:0 1px 3px rgba(62,29,102,.08)}
h2{font-size:20px;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-bottom:3px solid var(--amb);border-radius:10px;padding:16px 12px;text-align:left;color:var(--ink);font:600 17px 'Mukta',sans-serif;cursor:pointer}
.tile b{display:block;font-size:26px}
.tile.sos{background:var(--sos);color:#fff;border-color:var(--sos)}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:400 16px 'Mukta',sans-serif}
button.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:600 16px 'Mukta',sans-serif;cursor:pointer;margin:8px 8px 0 0}
button.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.big{width:100%;background:var(--sos);color:#fff;border:0;border-radius:14px;padding:26px 10px;font:800 26px 'Mukta',sans-serif;cursor:pointer}
nav{overflow-x:auto;position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-width:84px;max-width:120px;overflow-wrap:anywhere;line-height:1.2;background:none;border:0;padding:10px 2px;color:var(--mut);font:600 12px 'Mukta',sans-serif;cursor:pointer}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--pri);border-top:3px solid var(--amb);padding-top:7px;font-weight:800}
h3.sec{font-family:'Playfair Display','Mukta',serif;font-size:17px;margin:16px 0 6px;color:var(--pri)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--amb);color:#2A1F3D;font-size:13px;font-weight:600}
.pill.ok{background:#5B2D8E;color:#fff}
.muted{color:var(--mut);font-size:14px}
img.ph{max-width:100%;border-radius:8px;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
a.call{background:var(--pri);color:#fff;text-decoration:none;border-radius:8px;padding:8px 14px;font-weight:600}
summary{font-weight:600;cursor:pointer;padding:4px 0}
.star{background:none;border:0;font-size:26px;cursor:pointer;color:var(--amb);padding:0 2px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#3E1D66;color:#fff;padding:10px 18px;border-radius:20px;display:none;max-width:90%;z-index:9}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font:600 14px 'Mukta',sans-serif;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
a{color:var(--pri)}a.call{color:#fff}
#pbtn{background:#fff;color:#3E1D66;border:0;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){main{animation:in .25s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
/* Google Website Translator: hide its toolbar and widget, keep our own UI */
iframe.skiptranslate,.goog-te-banner-frame,.goog-te-balloon-frame,#goog-gt-tt,.goog-te-gadget-icon{display:none!important}
body{top:0!important}
.goog-text-highlight{background:none!important;box-shadow:none!important}
#gt_el{position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden}
font{vertical-align:baseline}

{id:'heat',k:['heat','heatwave','lu','\u0932\u0942','garmi'],en:['Stay indoors between 12 pm and 4 pm.','Drink water often, even if not thirsty. Use ORS or buttermilk.','Wear light, loose, cotton clothes and cover your head.','Fever, dizziness or confusion: move to shade, cool the body and call 108.'],hi:['\u0926\u094b\u092a\u0939\u0930 12 \u0938\u0947 4 \u092c\u091c\u0947 \u0924\u0915 \u0918\u0930 \u092e\u0947\u0902 \u0930\u0939\u0947\u0902\u0964','\u092a\u094d\u092f\u093e\u0938 \u0928 \u0939\u094b \u092b\u093f\u0930 \u092d\u0940 \u092a\u093e\u0928\u0940, ORS \u092f\u093e \u091b\u093e\u091b \u092a\u093f\u090f\u0902\u0964','\u0939\u0932\u094d\u0915\u0947, \u0922\u0940\u0932\u0947 \u0938\u0942\u0924\u0940 \u0915\u092a\u095c\u0947 \u092a\u0939\u0928\u0947\u0902 \u0914\u0930 \u0938\u093f\u0930 \u0922\u0915\u0947\u0902\u0964','\u092c\u0941\u0916\u093e\u0930, \u091a\u0915\u094d\u0915\u0930 \u092f\u093e \u092d\u094d\u0930\u092e \u092e\u0947\u0902 \u091b\u093e\u0901\u0935 \u092e\u0947\u0902 \u091c\u093e\u090f\u0902, \u0936\u0930\u0940\u0930 \u0920\u0902\u0921\u093e \u0915\u0930\u0947\u0902 \u0914\u0930 108 \u092a\u0930 \u0915\u0949\u0932 \u0915\u0930\u0947\u0902\u0964']},
{id:'prep',k:['prepare','preparation','kit','before','tayari','तैयारी'],en:['Keep an emergency kit: drinking water, dry food, torch, power bank, first-aid box, medicines, radio and copies of documents.','Make a family plan: where to meet and who to call. Save 112, 1078 and your district control room 1077 in your phone.','Know your nearest shelter, high ground and safe route. Keep the phone charged and the fuel tank at least half full.','Follow IMD and district authority warnings. Move early when told. Do not wait.'],hi:['आपातकालीन किट रखें: पीने का पानी, सूखा खाना, टॉर्च, पावर बैंक, फर्स्ट-एड बॉक्स, दवाइयाँ, रेडियो और ज़रूरी कागज़ों की कॉपी।','परिवार की योजना बनाएँ: कहाँ मिलना है और किसे फोन करना है। फोन में 112, 1078 और अपने ज़िला नियंत्रण कक्ष 1077 का नंबर सेव करें।','नज़दीकी आश्रय स्थल, ऊँची जगह और सुरक्षित रास्ता जानें। फोन चार्ज और वाहन की टंकी कम से कम आधी भरी रखें।','IMD और ज़िला प्रशासन की चेतावनी मानें। कहे जाने पर जल्दी निकलें, इंतज़ार न करें।']},
{id:'cyclone',k:['cyclone','storm','toofan','tufan','चक्रवात','तूफ़ान'],en:['When a warning is issued, stay indoors and away from windows. Do not go to the sea or the beach.','Secure loose objects, roof sheets and boats. Keep a radio and torch ready.','Store drinking water and dry food for several days. Charge phones and power banks.','If told to evacuate, go to the nearest cyclone shelter at once. Switch off power and gas before leaving.'],hi:['चेतावनी जारी होने पर घर के अंदर रहें और खिड़कियों से दूर रहें। समुद्र या समुद्र तट पर न जाएँ।','ढीली चीज़ें, छत की चादरें और नावें बाँधकर रखें। रेडियो और टॉर्च तैयार रखें।','कई दिनों के लिए पीने का पानी और सूखा खाना रखें। फोन और पावर बैंक चार्ज कर लें।','निकलने को कहा जाए तो तुरंत नज़दीकी चक्रवात आश्रय स्थल पर जाएँ। निकलने से पहले बिजली और गैस बंद करें।']},
{id:'lightning',k:['lightning','thunder','bijli','बिजली'],en:['At the first thunder, go inside a strong building or a vehicle with the windows closed.','Stay away from trees, poles, open fields, water and metal objects.','If caught outside, crouch low on the balls of your feet with your head down. Do not lie flat.','Do not use wired phones or plug-in appliances in a storm. Wait 30 minutes after the last thunder.'],hi:['पहली गड़गड़ाहट पर पक्की इमारत या बंद शीशों वाली गाड़ी के अंदर चले जाएँ।','पेड़ों, खंभों, खुले मैदान, पानी और धातु की चीज़ों से दूर रहें।','बाहर फँस जाएँ तो पंजों के बल नीचे झुककर बैठें और सिर झुका लें। ज़मीन पर लेटें नहीं।','तूफ़ान में तार वाले फोन या प्लग वाले उपकरण इस्तेमाल न करें। आखिरी गड़गड़ाहट के 30 मिनट बाद ही बाहर निकलें।']},
{id:'landslide',k:['landslide','mudslide','bhuskhalan','भूस्खलन'],en:['Cracks in the ground, tilting trees or poles and muddy water in streams are warning signs. Leave at once.','Move away from the slope to higher ground at the side. Do not run down the path of the slide.','Do not cross bridges or roads during heavy rain in hill areas.','After a slide, stay away from the area. More slides can follow. Call 112.'],hi:['ज़मीन में दरारें, झुकते पेड़ या खंभे और नालों में गंदा पानी चेतावनी के संकेत हैं। तुरंत जगह छोड़ दें।','ढलान से दूर, किनारे की ऊँची जगह पर जाएँ। भूस्खलन के रास्ते में नीचे की ओर न भागें।','पहाड़ी इलाकों में भारी बारिश के दौरान पुल या सड़क पार न करें।','भूस्खलन के बाद उस जगह से दूर रहें, और भूस्खलन हो सकते हैं। 112 पर कॉल करें।']},
{id:'tsunami',k:['tsunami','सुनामी'],en:['If the ground shakes strongly near the coast or the sea suddenly pulls back, run to high ground at once. Do not wait for a siren.','Move at least 2 km inland or to the upper floors of a strong building.','Stay away from the beach and harbours. Waves can come many times over several hours.','Return only when the district authority says it is safe.'],hi:['तट के पास ज़मीन तेज़ हिले या समुद्र अचानक पीछे हट जाए तो तुरंत ऊँची जगह पर भागें। सायरन का इंतज़ार न करें।','कम से कम 2 किमी अंदर की ओर या किसी मज़बूत इमारत की ऊपरी मंज़िल पर जाएँ।','समुद्र तट और बंदरगाह से दूर रहें। लहरें कई घंटों में कई बार आ सकती हैं।','ज़िला प्रशासन के सुरक्षित बताने पर ही लौटें।']}

function dsEval(j){
 var d=(j&&j.daily)||{},o=[],n=(d.time||[]).length;
 for(var i=0;i<n;i++){
  var dy=d.time[i],r=d.precipitation_sum&&d.precipitation_sum[i],g=d.wind_gusts_10m_max&&d.wind_gusts_10m_max[i],h=d.temperature_2m_max&&d.temperature_2m_max[i],w=d.weather_code&&d.weather_code[i];
  if(r>=64.5)o.push({k:'rain',lv:r>=204.5?3:(r>=115.6?2:1),v:Math.round(r),day:dy});
  if(g>=50)o.push({k:'gust',lv:g>=90?3:(g>=70?2:1),v:Math.round(g),day:dy});
  if(h>=40)o.push({k:'heat',lv:h>=46?3:(h>=43?2:1),v:Math.round(h),day:dy});
  if(w===95||w===96||w===99)o.push({k:'storm',lv:w===95?1:2,v:0,day:dy})}
 o.sort(function(a,b){return b.lv-a.lv||(a.day<b.day?-1:1)});return o}

function dsNotify(res){
 var seen=ld('dsSeen',{}),fresh=res.filter(function(a){return a.lv>=2&&!seen[a.k+a.day]});
 if(!fresh.length)return;
 fresh.forEach(function(a){seen[a.k+a.day]=1});
 var ks=Object.keys(seen);if(ks.length>60)ks.slice(0,ks.length-60).forEach(function(k){delete seen[k]});sv('dsSeen',seen);
 var m=t('dsL'+fresh[0].lv)+': '+dsMsg(fresh[0]);
 toast(m);try{if(navigator.vibrate)navigator.vibrate([300,150,300])}catch(e){}
 try{if(window.Notification&&Notification.permission==='granted')new Notification(t('dsNotif'),{body:m})}catch(e){}}
function dsCheck(silent){
 var run=function(l){
  if(!l){DS.busy=false;if(!silent)DS.err='noloc';dsPaint();return}
  var u='https://api.open-meteo.com/v1/forecast?latitude='+l.lat+'&longitude='+l.lng+'&daily=precipitation_sum,wind_gusts_10m_max,temperature_2m_max,weather_code&timezone=auto&forecast_days=3';
  fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
   DS.res=dsEval(j);DS.t=new Date();DS.busy=false;DS.err='';dsPaint();
   if(silent)dsNotify(DS.res);
   if(authed&&tab==='home')render()}).catch(function(){DS.busy=false;if(!silent)DS.err='net';dsPaint()})};
 if(silent){run(ld('dsLoc',null));return}

 getLoc(function(l){var q=l?{lat:+l.lat.toFixed(2),lng:+l.lng.toFixed(2)}:null;if(q)sv('dsLoc',q);run(q||ld('dsLoc',null))})}
